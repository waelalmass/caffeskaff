<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Skaff Menu</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: #f2c98b;
  background:
    linear-gradient(rgba(0,0,0,.80), rgba(0,0,0,.88)),
    url("https://images.unsplash.com/photo-1442512595331-e89e73853f31?auto=format&fit=crop&w=1200&q=85")
    center / cover fixed;
}
header {
  text-align: center;
  padding: 35px 12px 22px;
}
.logo {
  font-size: 55px;
  margin-bottom: 8px;
}
h1 {
  font-size: clamp(32px, 7vw, 58px);
  margin: 0;
  font-weight: 800;
}
.categories {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  padding: 20px 12px 35px;
}
.categories button {
  border: none;
  border-radius: 16px;
  background: #f2c98b;
  color: #17130f;
  padding: 17px 23px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
.menu {
  width: min(92%, 900px);
  margin: auto;
  display: grid;
  gap: 24px;
  padding-bottom: 35px;
}
.item {
  min-height: 170px;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 18px;
  border: 1px solid #34302b;
  border-radius: 23px;
  background: rgba(35,35,35,.88);
  box-shadow: 0 8px 25px rgba(0,0,0,.18);
}
.item img {
  width: 165px;
  height: 150px;
  object-fit: cover;
  border-radius: 19px;
  flex-shrink: 0;
}
.details {
  min-width: 0;
  flex: 1;
}
.name {
  font-size: clamp(17px, 3.3vw, 29px);
  font-weight: bold;
  overflow-wrap: anywhere;
}
.price {
  font-size: clamp(16px, 2.8vw, 25px);
  font-weight: bold;
  white-space: nowrap;
  text-align: right;
}
footer {
  text-align: center;
  padding: 25px 12px 45px;
}
footer span {
  display: inline-block;
  border: 1px solid #554738;
  border-radius: 35px;
  padding: 17px 28px;
  font-weight: bold;
}
@media (max-width: 500px) {
  header {
    padding-top: 28px;
  }
  .logo {
    font-size: 42px;
  }
  .categories {
    gap: 9px;
    padding-bottom: 28px;
  }
  .categories button {
    padding: 14px 15px;
    font-size: 15px;
  }
  .menu {
    width: 92%;
    gap: 16px;
  }
  .item {
    min-height: 125px;
    gap: 12px;
    padding: 12px;
    border-radius: 19px;
  }
  .item img {
    width: 92px;
    height: 105px;
    border-radius: 15px;
  }
  .name {
    font-size: 17px;
  }
  .price {
    font-size: 15px;
  }
}
@media (max-width: 350px) {
  .item {
    gap: 8px;
    padding: 9px;
  }
  .item img {
    width: 75px;
    height: 90px;
  }
  .name, .price {
    font-size: 13px;
  }
}
</style>
</head>

const menu = document.getElementById("menu");
function renderMenu(category = "all") {
  menu.innerHTML = "";
  products
    .filter(p => category === "all" || p.category === category)
    .forEach(p => {
      const card = document.createElement("article");
      card.className = "item";
      const img = document.createElement("img");
      img.src = p.image;
      img.alt = p.name;
      img.loading = "lazy";
      const details = document.createElement("div");
      details.className = "details";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = p.name;
      const price = document.createElement("div");
      price.className = "price";
      price.textContent = p.price.toLocaleString("en-US") + " L.L";
      details.append(name);
      card.append(img, details, price);
      menu.appendChild(card);
    });
}
function filterMenu(category) {
  renderMenu(category);
}
